<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Suparkompisen">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#221a14"/>
      <stop offset="100%" stop-color="#15100c"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#e8b76a"/>
      <stop offset="100%" stop-color="#b07730"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ff7cc3"/>
      <stop offset="100%" stop-color="#b73a82"/>
    </linearGradient>
  </defs>

  <!-- Rounded background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>

  <!-- Left tumbler tilted toward the centre (amber) -->
  <g transform="rotate(-16 182 286)">
    <g transform="translate(182, 286)">
      <path d="M -78 -116 L 78 -116 L 64 96 C 62 114 46 128 28 128 L -28 128 C -46 128 -62 114 -64 96 Z"
            fill="#2a201a" stroke="#d4974a" stroke-width="14"
            stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M -72 -8 L 72 -8 L 64 96 C 62 114 46 128 28 128 L -28 128 C -46 128 -62 114 -64 96 Z"
            fill="url(#amber)"/>
      <line x1="-70" y1="-8" x2="70" y2="-8" stroke="#f0d490" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    </g>
  </g>

  <!-- Right tumbler tilted toward the centre (pink) -->
  <g transform="rotate(16 330 286)">
    <g transform="translate(330, 286)">
      <path d="M -78 -116 L 78 -116 L 64 96 C 62 114 46 128 28 128 L -28 128 C -46 128 -62 114 -64 96 Z"
            fill="#2a201a" stroke="#e85aad" stroke-width="14"
            stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M -72 -8 L 72 -8 L 64 96 C 62 114 46 128 28 128 L -28 128 C -46 128 -62 114 -64 96 Z"
            fill="url(#pink)"/>
      <line x1="-70" y1="-8" x2="70" y2="-8" stroke="#ffc1de" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    </g>
  </g>

  <!-- Spark at the clink point -->
  <g transform="translate(256, 168)">
    <path d="M 0 -32 L 5 -10 L 27 -8 L 9 5 L 14 27 L 0 14 L -14 27 L -9 5 L -27 -8 L -5 -10 Z"
          fill="#f0d490"/>
    <circle cx="-30" cy="22" r="5" fill="#ffc1de"/>
    <circle cx="30" cy="22" r="5" fill="#e8b76a"/>
  </g>
</svg>
